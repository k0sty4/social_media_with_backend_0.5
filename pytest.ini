[pytest]
testpaths = tests
# Tests import app.py / models.py / sanitize.py from the project root.
pythonpath = .
# The app intentionally uses datetime.utcnow(); hide that 3rd-party deprecation
# noise so the test report stays readable.
filterwarnings =
    ignore::DeprecationWarning
# E2E (browser) tests are heavy and need Node + live servers, so they're
# excluded from the default run. Run them explicitly with:  pytest -m e2e
markers =
    e2e: end-to-end browser tests (start live backend + frontend, drive Chromium)
addopts = -m "not e2e"
